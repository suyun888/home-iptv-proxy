services:
  home-iptv-proxy:
    build: .
    image: home-iptv-proxy:local
    container_name: home-iptv-proxy
    network_mode: host
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - ./config:/app/config
    environment:
      IPTV_CONFIG: /app/config/sources.yaml
      IPTV_ADMIN_PASSWORD: ${IPTV_ADMIN_PASSWORD:?Set IPTV_ADMIN_PASSWORD in .env}
      TZ: Asia/Shanghai
